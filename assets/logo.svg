<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Second Screen Studios logo">
  <title>Second Screen Studios</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1A4F"/>
      <stop offset="1" stop-color="#07061A"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A6FF"/>
      <stop offset="0.5" stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#4A2FD6"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DE0FF"/>
      <stop offset="1" stop-color="#3DE0FF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- second screen: glowing cyan outline behind -->
  <rect x="19" y="26" width="54" height="36" rx="7" fill="none" stroke="url(#back)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- primary screen -->
  <rect x="42" y="50" width="58" height="42" rx="9" fill="url(#front)"/>
  <!-- glass highlight -->
  <rect x="48" y="55" width="26" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- forward chevrons: game-UI cue, avoids a play-button look -->
  <path d="M64 63 L76 72 L64 81 M77 63 L89 72 L77 81" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
