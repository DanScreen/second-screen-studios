<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Second Screen Studios logo">
  <title>Second Screen Studios</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1640"/>
      <stop offset="1" stop-color="#09081C"/>
    </linearGradient>
    <linearGradient id="first" gradientUnits="userSpaceOnUse" x1="35" y1="17" x2="80" y2="62">
      <stop offset="0" stop-color="#B49CFF"/>
      <stop offset="1" stop-color="#6A45FF"/>
    </linearGradient>
    <linearGradient id="second" gradientUnits="userSpaceOnUse" x1="40" y1="58" x2="85" y2="103">
      <stop offset="0" stop-color="#4CE6FF"/>
      <stop offset="1" stop-color="#1192E8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- split S: two halves cut by one slanted slit; the second half is the "second screen" -->
  <path d="M74.74 31.67 A18 18 0 1 0 56.87 59.73" fill="none" stroke="url(#first)" stroke-width="14"/>
  <path d="M63.13 60.27 A18 18 0 1 1 45.26 88.33" fill="none" stroke="url(#second)" stroke-width="14"/>
</svg>
